services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: py-l1l2-cache:latest
    environment:
      - APP_ENV=test
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "-m", "pytest", "tests"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
